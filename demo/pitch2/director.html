<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FlameGuard AI — pitch director</title>
<script src="../out/pitch2/timeline.js"></script>
<style>
  :root { --bg:#05070d; --ink:#f1f5f9; --ink2:#a3b1c6; --ink3:#7b8aa3; --flame:#fbbf24; --ember:#fb923c; --plasma:#22d3ee; --violet:#a78bfa; --blue:#60a5fa; }
  * { box-sizing:border-box; }
  html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:var(--bg); color:var(--ink); font-family:"Segoe UI", system-ui, sans-serif; }
  #bg, #fg, #fx { position:absolute; inset:0; }
  #bg { overflow:hidden; }
  .bgitem { position:absolute; inset:0; overflow:hidden; }
  .bgitem video { width:100%; height:100%; object-fit:cover; }
  .shade { position:absolute; inset:0; background:radial-gradient(120% 90% at 50% 40%, transparent 30%, rgb(5 7 13 / .75) 100%); }
  .dark { position:absolute; inset:0; background:rgb(5 7 13 / .55); }
  .aurora { position:absolute; inset:-20%; background:
      radial-gradient(40% 35% at 75% 25%, rgb(34 211 238 / .16), transparent 70%),
      radial-gradient(45% 40% at 20% 80%, rgb(251 191 36 / .14), transparent 70%),
      radial-gradient(35% 30% at 50% 50%, rgb(167 139 250 / .08), transparent 70%), var(--bg);
    animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(-4%, 3%) scale(1.08) rotate(3deg); } }
  .stars { position:absolute; inset:0; background-image:radial-gradient(1.5px 1.5px at 12% 22%,#fff9,transparent),radial-gradient(1px 1px at 72% 18%,#fff8,transparent),radial-gradient(1.5px 1.5px at 85% 64%,#fff7,transparent),radial-gradient(1px 1px at 30% 78%,#fff8,transparent),radial-gradient(1px 1px at 55% 40%,#fff6,transparent),radial-gradient(1.5px 1.5px at 20% 55%,#fff7,transparent),radial-gradient(1px 1px at 92% 30%,#fff8,transparent),radial-gradient(1px 1px at 40% 12%,#fff7,transparent),radial-gradient(1px 1px at 63% 88%,#fff6,transparent); animation: twinkle 6s ease-in-out infinite alternate; }
  @keyframes twinkle { to { opacity:.45; } }
  .scene { position:absolute; inset:0; }
  /* overlays */
  #grain { position:absolute; inset:-50%; pointer-events:none; opacity:.07; mix-blend-mode:overlay; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); animation: grain 0.6s steps(6) infinite; }
  @keyframes grain { 0%{transform:translate(0,0)} 20%{transform:translate(-5%,3%)} 40%{transform:translate(4%,-4%)} 60%{transform:translate(-3%,5%)} 80%{transform:translate(5%,2%)} 100%{transform:translate(0,0)} }
  #vignette { position:absolute; inset:0; pointer-events:none; background:radial-gradient(130% 100% at 50% 50%, transparent 55%, rgb(0 0 0 / .55) 100%); }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; mix-blend-mode:screen; }
  .credit { position:absolute; left:56px; bottom:44px; font-size:20px; color:#cbd5e1; background:rgb(5 7 13 / .55); padding:8px 14px; border-radius:10px; border:1px solid rgb(255 255 255 / .12); backdrop-filter:blur(6px); }
  .credit b { color:var(--plasma); font-weight:600; }
  /* typography */
  .kin { position:absolute; left:0; right:0; text-align:center; font-weight:800; letter-spacing:-.02em; line-height:1.05; text-shadow:0 6px 40px rgb(0 0 0 / .75), 0 2px 8px rgb(0 0 0 / .6); }
  .kin .w { display:inline-block; opacity:0; transform:translateY(40px) rotateX(-60deg); filter:blur(10px); transform-origin:50% 100%; }
  .grad { background:linear-gradient(90deg,var(--flame),var(--ember)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .glow { text-shadow:0 0 40px rgb(251 146 60 / .35); }
  .eyebrow { font-size:26px; letter-spacing:.32em; text-transform:uppercase; color:var(--plasma); font-weight:600; }
  /* browser frame */
  .frame-wrap { position:absolute; perspective:2200px; }
  .frame { position:relative; width:100%; height:100%; border-radius:22px; overflow:hidden; background:#0b1020; border:1px solid rgb(255 255 255 / .14);
           box-shadow:0 60px 120px -20px rgb(0 0 0 / .8), 0 0 0 1px rgb(255 255 255 / .04), 0 0 80px -10px rgb(34 211 238 / .25); transform-style:preserve-3d; }
  .frame .bar { height:44px; display:flex; align-items:center; gap:10px; padding:0 18px; background:#0e1424; border-bottom:1px solid rgb(255 255 255 / .08); }
  .frame .bar i { width:12px; height:12px; border-radius:50%; display:block; }
  .frame .url { margin-left:16px; flex:1; height:26px; border-radius:8px; background:rgb(255 255 255 / .05); color:var(--ink3); font-size:15px; display:flex; align-items:center; padding:0 12px; font-family:Consolas, monospace; }
  .frame .vp { position:absolute; top:44px; left:0; right:0; bottom:0; overflow:hidden; }
  .frame .vp video { width:100%; height:100%; object-fit:cover; object-position:top; transform-origin:var(--fx,50%) var(--fy,30%); }
  .sheen { position:absolute; inset:0; background:linear-gradient(115deg, transparent 35%, rgb(255 255 255 / .10) 50%, transparent 65%); transform:translateX(-120%); pointer-events:none; }
  .feature { position:absolute; width:520px; }
  .feature .num { font-family:Consolas, monospace; font-size:22px; color:var(--flame); letter-spacing:.2em; }
  .feature h2 { margin:12px 0 0; font-size:72px; line-height:1; font-weight:800; letter-spacing:-.02em; }
  .feature p { margin:18px 0 0; font-size:28px; line-height:1.35; color:var(--ink2); }
  .feature .line { height:4px; width:0; margin-top:24px; border-radius:4px; background:linear-gradient(90deg,var(--flame),var(--ember)); }
  .chip { display:inline-flex; align-items:center; gap:10px; padding:10px 20px; border-radius:999px; border:1px solid; font-size:24px; font-weight:600; }
  .stat { position:absolute; text-align:left; padding:26px 32px; border-radius:24px; background:rgb(8 12 24 / .85); border:1px solid rgb(255 255 255 / .14); box-shadow:0 30px 80px rgb(0 0 0 / .6); backdrop-filter:blur(10px); }
  .stat .v { font-family:Consolas, monospace; font-size:96px; font-weight:800; line-height:1; }
  .stat .l { margin-top:8px; font-size:24px; color:var(--ink2); max-width:380px; }
  .tile { position:absolute; padding:34px 38px; border-radius:26px; border:1px solid rgb(255 255 255 / .14); background:rgb(8 12 24 / .72); backdrop-filter:blur(12px); }
  .tile .big { font-family:Consolas, monospace; font-size:58px; font-weight:800; white-space:nowrap; }
  .tile .lbl { margin-top:10px; font-size:28px; color:var(--ink2); line-height:1.35; }
  .src { position:absolute; right:56px; bottom:44px; font-size:19px; color:var(--ink3); }
  .src b { color:var(--plasma); font-weight:600; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="fg"></div>
<div id="fx"><div id="grain"></div><div id="vignette"></div><div id="flash"></div></div>
<script>
const TL = window.TIMELINE;
const CLIPS = "../out/pitch2/seek/clips/";
const STOCK = "../out/pitch2/seek/stock/";
const $ = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; };
const bgLayer = document.getElementById("bg"), fgLayer = document.getElementById("fg"), flashEl = document.getElementById("flash");
const ease = "cubic-bezier(.22,1,.36,1)";

// ---------- deterministic engine: everything runs on virtual time VT (seconds) ----------
let VT = 0;
const ANIMS = [], TIMERS = [], TICKERS = [], VIDEOS = new Map();
function A(el, kf, opts) { const a = el.animate(kf, opts); a.pause(); ANIMS.push({ a, born: VT }); return a; }
function after(ms, fn) { TIMERS.push({ at: VT + ms / 1000, fn }); }
function ticker(fn) { TICKERS.push({ born: VT, fn }); }
function playVideo(v, offset = 0) { VIDEOS.set(v, { born: VT, offset }); }

// ---------- media pool (preloaded, seeked ahead of time) ----------
const pool = {};
function media(src) {
  if (!pool[src]) { const v = document.createElement("video"); v.src = src; v.muted = true; v.preload = "auto"; v.playsInline = true; pool[src] = v; }
  return pool[src];
}
const prepare = (src, offset) => { const v = media(src); v.pause(); try { v.currentTime = offset || 0; } catch (e) {} return v; };

// ---------- helpers ----------
function flash(strength = .55, dur = 380) { A(flashEl, [{ opacity: strength }, { opacity: 0 }], { duration: dur, easing: "ease-out" }); }
function kinetic(text, { top = 420, size = 120, cls = "", delay = 0, stagger = 90, color = "", left = null } = {}) {
  const el = $(`<div class="kin ${cls}" style="top:${top}px;font-size:${size}px;${left !== null ? `left:${left}px;right:auto;text-align:left;` : ""}${color}"></div>`);
  text.split(/(\s+)/).forEach((tok) => {
    if (/^\s+$/.test(tok)) { el.append(" "); return; }
    const hl = tok.startsWith("*"); const w = $(`<span class="w ${hl ? "grad glow" : ""}">${tok.replace(/^\*/, "")}</span>`); el.append(w);
  });
  [...el.querySelectorAll(".w")].forEach((w, i) => A(w, 
    [{ opacity: 0, transform: "translateY(40px) rotateX(-60deg)", filter: "blur(10px)" }, { opacity: 1, transform: "none", filter: "blur(0)" }],
    { duration: 700, delay: delay + i * stagger, easing: ease, fill: "forwards" }));
  return el;
}
function enterAnim(el, kind = "zoom", dur = 700) {
  const K = {
    zoom: [{ opacity: 0, transform: "scale(1.12)", filter: "blur(14px)" }, { opacity: 1, transform: "scale(1)", filter: "blur(0)" }],
    up: [{ opacity: 0, transform: "translateY(60px)" }, { opacity: 1, transform: "none" }],
    wipe: [{ clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0 0 0)" }],
    wipeR: [{ clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0)" }],
    circle: [{ clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(80% at 50% 50%)" }],
    fade: [{ opacity: 0 }, { opacity: 1 }],
  };
  A(el, K[kind], { duration: dur, easing: ease, fill: "both" });
}
function exitAndRemove(el, kind = "fade", dur = 600) {
  const K = { fade: [{ opacity: 1 }, { opacity: 0 }], zoomOut: [{ opacity: 1, transform: "scale(1)", filter: "blur(0)" }, { opacity: 0, transform: "scale(.92)", filter: "blur(10px)" }],
              left: [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(-140px)" }] };
  A(el, K[kind], { duration: dur, easing: ease, fill: "forwards" }); after(dur + 30, () => el.remove());
}

// ---------- background ----------
let currentBg = null;
function setBg(spec, transition = "zoom") {
  const item = $(`<div class="bgitem"></div>`);
  if (spec.video) {
    const v = media(spec.video); v.style.cssText = ""; item.append(v);
    playVideo(v, spec.offset || 0);
    A(v, [{ transform: `scale(${spec.from || 1.02})` }, { transform: `scale(${spec.to || 1.12})` }], { duration: (spec.kb || 14) * 1000, fill: "forwards", easing: "linear" });
    if (spec.dim !== false) item.append($(`<div class="${spec.heavy ? "dark" : "shade"}"></div>`));
    if (spec.blur) v.style.filter = `blur(${spec.blur}px) saturate(1.1)`;
  } else {
    item.append($(`<div class="aurora"></div>`)); item.append($(`<div class="stars"></div>`));
  }
  if (spec.credit) item.append($(`<div class="credit">NASA footage · <b>${spec.credit}</b></div>`));
  bgLayer.append(item);
  enterAnim(item, transition, 900);
  if (currentBg) { const old = currentBg; after(1000, () => old.remove()); }
  currentBg = item;
}

// ---------- screen clip in a 3D browser frame ----------
function screen(scene, { clip, offset = 0, side = "right", title, num, sub, url = "localhost:3000", fx = "50%", fy = "30%", zoom = 1.12, cuts }) {
  const W = 1240, H = 740, x = side === "right" ? 600 : 80, y = 170;
  const wrap = $(`<div class="frame-wrap" style="left:${x}px;top:${y}px;width:${W}px;height:${H}px"></div>`);
  const frame = $(`<div class="frame"><div class="bar"><i style="background:#f87171"></i><i style="background:#fbbf24"></i><i style="background:#34d399"></i><div class="url">${url}</div></div><div class="vp"></div><div class="sheen"></div></div>`);
  const v = media(CLIPS + clip + ".webm"); v.style.setProperty("--fx", fx); v.style.setProperty("--fy", fy);
  frame.querySelector(".vp").append(v); wrap.append(frame);
  playVideo(v, offset);
  const rot = side === "right" ? -14 : 14;
  A(frame, [{ transform: `translateX(${side === "right" ? 260 : -260}px) rotateY(${rot * 2}deg) rotateX(6deg) scale(.88)`, opacity: 0 },
                 { transform: `rotateY(${rot / 2}deg) rotateX(2deg) scale(1)`, opacity: 1 }], { duration: 1100, easing: ease, fill: "forwards" });
  A(frame, [{ transform: `rotateY(${rot / 2}deg) rotateX(2deg) scale(1)` }, { transform: `rotateY(${rot / 5}deg) rotateX(0deg) scale(1.02)` }],
                { duration: scene.dur * 1000, delay: 1100, easing: "ease-in-out", fill: "forwards" });
  A(v, [{ transform: "scale(1)" }, { transform: `scale(${zoom})` }], { duration: scene.dur * 1000, delay: 600, easing: "ease-in-out", fill: "forwards" });
  A(frame.querySelector(".sheen"), [{ transform: "translateX(-120%)" }, { transform: "translateX(120%)" }], { duration: 1600, delay: 700, easing: "ease-in-out" });
  if (cuts) cuts.forEach((c) => after(c.at * 1000, () => { flash(.35, 300); playVideo(v, c.offset); }));
  const nodes = [wrap];
  if (title) {
    const fxl = side === "right" ? 90 : 1360;
    const feat = $(`<div class="feature" style="left:${fxl}px;top:330px">${num ? `<div class="num">${num}</div>` : ""}<h2>${title}</h2>${sub ? `<p>${sub}</p>` : ""}<div class="line"></div></div>`);
    [...feat.children].forEach((c, i) => A(c, [{ opacity: 0, transform: "translateY(30px)" }, { opacity: 1, transform: "none" }], { duration: 700, delay: 300 + i * 140, easing: ease, fill: "both" }));
    A(feat.querySelector(".line"), [{ width: "0px" }, { width: "180px" }], { duration: 900, delay: 700, easing: ease, fill: "forwards" });
    nodes.push(feat);
  }
  return nodes;
}

// ---------- scenes ----------
const voiceDur = (s) => s.dur - 1.0;  // approx speaking time inside a scene
const SCENES = {
  cold_open: (s) => { setBg({ video: STOCK + "flame.webm", from: 1.0, to: 1.18, kb: 16, credit: "hot flame aboard the ISS (Cool Flames Investigation)" }, "fade");
    const bars = [$(`<div style="position:absolute;left:0;right:0;top:0;height:120px;background:#000"></div>`), $(`<div style="position:absolute;left:0;right:0;bottom:0;height:120px;background:#000"></div>`)];
    A(bars[0], [{ height: "540px" }, { height: "120px" }], { duration: 2200, easing: ease, fill: "forwards" });
    A(bars[1], [{ height: "540px" }, { height: "120px" }], { duration: 2200, easing: ease, fill: "forwards" });
    return bars; },
  s01: (s) => { const g = $(`<div style="position:absolute;inset:0;background:linear-gradient(90deg, rgb(5 7 13 / .85) 0%, rgb(5 7 13 / .55) 38%, transparent 62%)"></div>`);
    A(g, [{ opacity: 0 }, { opacity: 1 }], { duration: 900, delay: 1800, fill: "both" });
    return [g, kinetic("No up.", { top: 330, size: 120, delay: 2300, left: 140 }), kinetic("No down.", { top: 470, size: 120, delay: 3100, left: 140 }),
            kinetic("Just a *sphere *of *fire.", { top: 640, size: 84, delay: 4300, stagger: 120, left: 140 })]; },
  s02: (s) => { setBg({ video: STOCK + "earth1.webm", from: 1.05, to: 1.15, kb: 9 }, "zoom"); flash(.25);
    return [kinetic("In microgravity,", { top: 360, size: 64, cls: "", delay: 200 }), kinetic("fire *does *not *rise.", { top: 450, size: 150, delay: 700, stagger: 130 })]; },
  s03: (s) => { setBg({ aurora: true }, "circle");
    const lower = $(`<div style="position:absolute;left:90px;top:950px;display:flex;align-items:center;gap:18px"><div style="width:8px;height:64px;border-radius:4px;background:linear-gradient(var(--flame),var(--ember))"></div><div><div style="font-size:44px;font-weight:800">Fahim Foysal</div><div style="font-size:22px;color:var(--ink2);letter-spacing:.14em;text-transform:uppercase">NASA Space Apps Challenge 2026 · Flame in Freefall</div></div></div>`);
    A(lower, [{ opacity: 0, transform: "translateX(-60px)" }, { opacity: 1, transform: "none" }], { duration: 800, delay: 400, easing: ease, fill: "both" });
    const nodes = screen(s, { clip: "spaceapps", offset: 2.6, side: "right", url: "spaceappschallenge.org/2026", fy: "0%", zoom: 1.06, cuts: [{ at: 3.2, offset: 11.8 }],
                              title: "Flame in Freefall", sub: "AI-powered fire safety insights from microgravity combustion data" });
    return [...nodes, lower]; },
  logo: (s) => { setBg({ aurora: true }, "fade"); flash(.6, 600);
    const orb = $(`<div style="position:absolute;left:50%;top:330px;width:220px;height:220px;margin-left:-110px;border-radius:50%;background:radial-gradient(circle,#e0f2fe 0%,#38bdf8 30%,#f59e0b 64%,transparent 71%);box-shadow:0 0 140px rgb(251 146 60 / .7)"></div>`);
    A(orb, [{ transform: "scale(0)", opacity: 0 }, { transform: "scale(1.25)", opacity: 1, offset: .6 }, { transform: "scale(1)", opacity: 1 }], { duration: 1100, easing: ease, fill: "forwards" });
    const ring = $(`<div style="position:absolute;left:50%;top:440px;width:520px;height:200px;margin:-100px 0 0 -260px;border-radius:50%;border:2px solid rgb(34 211 238 / .6);transform:rotate(-20deg)"></div>`);
    A(ring, [{ opacity: 0, transform: "rotate(-20deg) scale(.4)" }, { opacity: 1, transform: "rotate(-20deg) scale(1)" }], { duration: 1300, delay: 200, easing: ease, fill: "both" });
    return [ring, orb, kinetic("FlameGuard *AI", { top: 600, size: 140, delay: 500, stagger: 160 }),
            kinetic("Fire safety intelligence for space exploration", { top: 790, size: 34, delay: 1300, stagger: 50, color: "letter-spacing:.06em;color:var(--ink2);font-weight:500" })]; },
  s04: (s) => { const nodes = screen(s, { clip: "landing", side: "right", title: "FlameGuard AI", sub: "NASA's ISS experiments, turned into fire-safety insight", fy: "0%", zoom: 1.1 });
    const chips = $(`<div style="position:absolute;left:90px;top:640px;display:flex;flex-direction:column;gap:14px;align-items:flex-start">
      <span class="chip" style="color:#22d3ee;border-color:#22d3ee66;background:#22d3ee14">◉ NASA observed</span>
      <span class="chip" style="color:#a78bfa;border-color:#a78bfa66;background:#a78bfa14">◆ ML prediction</span>
      <span class="chip" style="color:#60a5fa;border-color:#60a5fa66;background:#60a5fa14">Σ Statistical estimate</span></div>`);
    [...chips.children].forEach((c, i) => A(c, [{ opacity: 0, transform: "translateX(-40px) scale(.9)" }, { opacity: 1, transform: "none" }], { duration: 600, delay: 5200 + i * 250, easing: ease, fill: "both" }));
    const promise = kinetic("It never *invents *a *number.", { top: 960, size: 46, delay: 8200, stagger: 90 }); promise.style.textAlign = "left"; promise.style.left = "90px";
    return [...nodes, chips, promise]; },
  whyhit: (s) => { setBg({ video: STOCK + "booster2.webm", from: 1.0, to: 1.1, kb: 10, credit: "SLS booster test (fire for scale)" }, "wipe"); flash(.5);
    return [kinetic("Why does it *matter?", { top: 440, size: 130, delay: 150, stagger: 110 })]; },
  s05: (s) => { setBg({ video: STOCK + "astro_rack.webm", from: 1.04, to: 1.14, kb: 13, credit: "Combustion Integrated Rack aboard the ISS", heavy: true }, "zoom");
    return [kinetic("A spacecraft is a *sealed *world.", { top: 300, size: 76, delay: 900 }),
            kinetic("Below what oxygen level", { top: 450, size: 66, delay: 5200, stagger: 80 }),
            kinetic("will a flame *refuse *to *keep *burning?", { top: 540, size: 66, delay: 5800, stagger: 80 }),
            $(`<div class="src">Source: <b>NASA/TP-2015-216046, p. 2</b></div>`)]; },
  s06: (s) => { setBg({ video: STOCK + "iss_ext.webm", from: 1.0, to: 1.08, kb: 11, blur: 6, credit: "International Space Station" }, "wipeR");
    const head = kinetic("The atmospheres crews *breathe", { top: 230, size: 70, delay: 200 });
    const t1 = $(`<div class="tile" style="left:220px;top:420px;width:680px"><div class="big" style="color:var(--plasma)">21% O₂ · 1 atm</div><div class="lbl">Normal space station cabin</div></div>`);
    const t2 = $(`<div class="tile" style="left:1020px;top:420px;width:680px"><div class="big" style="color:var(--flame)">30% O₂ · 0.7 atm</div><div class="lbl">Pre-spacewalk atmosphere, and the highest oxygen proposed for future exploration vehicles</div></div>`);
    A(t1, [{ opacity: 0, transform: "translateY(80px) rotateX(30deg)" }, { opacity: 1, transform: "none" }], { duration: 900, delay: 1600, easing: ease, fill: "both" });
    A(t2, [{ opacity: 0, transform: "translateY(80px) rotateX(30deg)" }, { opacity: 1, transform: "none" }], { duration: 900, delay: 3600, easing: ease, fill: "both" });
    return [head, t1, t2, $(`<div class="src">Source: <b>NASA/TP-2015-216046, p. 13</b></div>`)]; },
  s07: (s) => { setBg({ video: STOCK + "sofie.webm", from: 1.0, to: 1.12, kb: 14, heavy: true, credit: "flame burning out in microgravity (SoFIE)" }, "zoom");
    const head = kinetic("2009 – 2011 · aboard the ISS", { top: 210, size: 56, delay: 100 });
    const mk = (n, label, color, left, at) => {
      const el = $(`<div class="stat" style="left:${left}px;top:400px;width:480px"><div class="v" style="color:${color}">0</div><div class="l">${label}</div></div>`);
      A(el, [{ opacity: 0, transform: "translateY(60px) scale(.9)" }, { opacity: 1, transform: "none" }], { duration: 700, delay: at, easing: ease, fill: "both" });
      after(at, () => { const v = el.querySelector(".v"); ticker((dt) => { const k = Math.min(1, dt / 1.3); v.textContent = Math.round(n * (1 - Math.pow(1 - k, 3))); }); });
      return el; };
    return [head, mk(274, "fuel droplets burned in orbit", "#f1f5f9", 200, 2600), mk(186, "flames went out on their own", "#22d3ee", 720, 6400), mk(88, "flames kept burning", "#fbbf24", 1240, 9600),
            $(`<div class="src">Source: <b>NASA PSI-69 dataset</b></div>`)]; },
  s08: (s) => { setBg({ aurora: true }, "circle");
    const stack = $(`<div style="position:absolute;left:50%;top:150px;width:300px;height:380px;margin-left:-150px"></div>`);

// ---------- player ----------
let fgNodes = [];
function enter(scene, idx) {
  const nodes = (SCENES[scene.id] || (() => []))(scene) || [];
  const prev = fgNodes; fgNodes = [];
  prev.forEach((n) => exitAndRemove(n, n.classList?.contains("frame-wrap") ? "left" : "zoomOut", 550));
  nodes.forEach((n) => { fgLayer.append(n); fgNodes.push(n); });
  const next = TL.scenes[idx + 1];
  
}

async function preloadAll() {
  const srcs = new Set(); Object.values(PREP).forEach((l) => l.forEach(([s]) => srcs.add(s)));
  await Promise.all([...srcs].map((s) => new Promise((res) => { const v = media(s); if (v.readyState >= 2) return res();
    v.addEventListener("loadeddata", res, { once: true }); v.addEventListener("error", res, { once: true }); v.load(); })));
  document.getAnimations().forEach((a) => a.pause());
  window.__ready = true;
}

let nextScene = 0;
const seekTo = (v, t) => new Promise((res) => {
  const target = Math.max(0, Math.min(t, (v.duration || t) - 0.04));
  if (Math.abs(v.currentTime - target) < 0.004) return res();
  const done = () => res(); v.addEventListener("seeked", done, { once: true }); v.currentTime = target; setTimeout(done, 3000);
});
window.__renderAt = async (vt) => {
  VT = vt;
  while (nextScene < TL.scenes.length && TL.scenes[nextScene].start <= vt + 1e-6) { enter(TL.scenes[nextScene], nextScene); nextScene++; }
  for (let i = 0; i < TIMERS.length; i++) if (TIMERS[i].at <= vt + 1e-6) { const t = TIMERS.splice(i--, 1)[0]; t.fn(); }
  TICKERS.forEach((k) => k.fn(vt - k.born));
  ANIMS.forEach(({ a, born }) => { try { a.currentTime = (vt - born) * 1000; } catch (e) {} });
  document.getAnimations().forEach((a) => { if (a instanceof CSSAnimation) { a.pause(); a.currentTime = vt * 1000; } });
  const seeks = [];
  VIDEOS.forEach(({ born, offset }, v) => { if (v.isConnected) seeks.push(seekTo(v, offset + (vt - born))); });
  await Promise.all(seeks);
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  return true;
};
preloadAll();
